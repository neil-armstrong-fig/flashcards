<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <!--
      Applies the saved colours before first paint, so a learner who chose light on a device set to dark never sees a dark
      flash. It reads the same setting the app keeps (`SETTINGS_STORAGE_KEY`, `Theme`), and the two ground colours are
      `--color-ground` in `src/index.css`. `ThemeApplier` takes over once the app has started. Like the author's site (https://github.com/neil-armstrong-fig/personal-site).
    -->
    <script>
      {
        let theme = "system";

        try {
          const stored = JSON.parse(localStorage.getItem("language-learning.settings.v1") ?? "null");

          if (stored?.theme === "light" || stored?.theme === "dark") {
            theme = stored.theme;
          }
        } catch {
          // Blocked or unreadable storage: follow the device.
        }

        if (theme !== "system") {
          document.documentElement.dataset.theme = theme;
        }

        const light = theme === "light" || (theme === "system" && matchMedia("(prefers-color-scheme: light)").matches);

        document.querySelector('meta[name="theme-color"]').setAttribute("content", light ? "#f4f7f6" : "#000000");
      }
    </script>
    <meta name="description" content="Spaced-repetition language study with audio, streaks and memory aids." />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <title>Language Learning</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
